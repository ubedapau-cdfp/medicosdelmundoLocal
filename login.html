<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio de Sesión</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="Imagenes/logo.png">
</head><!-- Apartado de login heredado del otro proyecto -->
    <body class="login-body"> <!-- Inicio del body -->
    <section class="loginMenu"> <!-- Inicio del section loginMenu -->
        <section class="ladoIzqdo"> <!-- Inicio del section ladoIzqdo -->
            <p></p> <!-- Separador -->
        </section> <!-- Cierre del section ladoIzqdo -->
        <section class="ladoDcho"> <!-- Inicio del section ladoDcho -->
            <section class="menuform"> <!-- Inicio del section menuform -->
                <h1 class="h1login">Inicio de Sesión</h1> <!-- Párrafo de texto estilo h1 que sirve como título -->
                &nbsp; <!-- Non-Breaking Space. Proporciona saltos de línea, con un espacio. -->
                <form id='loginForm' action='' method='POST'> <!-- Inicio de formulario con método POST -->
                    <label for='usuaria'>Nombre de usuaria:</label> <!-- Texto para identificar el apartado 'Nombre' -->
                    <p></p> <!-- Separador -->
                    <input type='text' name='usuaria' id='usuaria' size='70' placeholder=' Usuaria' required> <!-- Campo de texto del apartado 'Nombre' obligatorio -->
                    <p></p> <!-- Separador -->
                    <label for='contrasena'>Contraseña:</label> <!-- Texto para identificar el apartado 'Contrasena' -->
                    <p></p> <!-- Separador -->
                    <!-- Agrupa el campo y el botón para que el ojo pueda colocarse encima del campo. -->
                    <div class='password-field'>
                        <!-- type='password' oculta lo escrito. El id permite que JavaScript encuentre este campo. -->
                        <input type='password' name='contrasena' size='70' id='contrasena' placeholder=' •••••••' required> <!-- Campo de texto del apartado 'Contrasena' obligatorio -->
                        <!-- type='button' evita que este botón envíe el formulario. Su id lo conecta con JavaScript. -->
                        <!-- aria-label ayuda a los lectores de pantalla y title muestra una descripción al dejar el cursor encima. -->
                        <button type='button' class='password-toggle is-hidden' id='mostrarContrasena' aria-label='Mostrar contraseña' aria-pressed='false' title='Mostrar contraseña' onclick='cambiarContrasena()'>
                            <!-- Estos elementos vacíos forman el ojo con CSS; aria-hidden evita que se lean como contenido. -->
                            <span class='password-toggle__icon' aria-hidden='true'><span></span></span>
                        </button>
                    </div>
                    <p></p> <!-- Separador -->
                    <div class='login-alert' id='loginAlert' role='alert' aria-live='assertive' hidden>
                        La contraseña es incorrecta. Inténtalo de nuevo.
                    </div>
                    <div class="button-group">
                        <button type='submit' class="defaultbutton">Iniciar Sesión</button> <!-- Botón para iniciar sesión -->
                        <button type='button' class="defaultbutton" id='forzarError'>Forzar error</button>
                        <a class="defaultbutton" href='index.html'>Volver a Inicio</a>
                    </div>
                    <p></p> <!-- Separador -->
                </form> <!-- Cierre del formulario -->
            </section> <!-- Cierre del section menuform -->
        </section> <!-- Cierre del section ladoDcho -->
    </section> <!-- Cierre del section loginMenu -->
    <!-- Carga el archivo JavaScript cuando los elementos del formulario ya existen en la página. -->
    <script src='login.js'></script>
</body> <!-- Cierre del body -->
</html>
